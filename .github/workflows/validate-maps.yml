name: Validate map interactions
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: maps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Import assets
        run: godot --headless --path . --editor --import
      - name: Verify assets and progression
        run: |
          python3 tools/validate_assets.py
          godot --headless --path . --script tests/p01_smoke.gd
          godot --headless --path . --script tests/maps_smoke.gd
      - name: Render and exercise native input
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 90 xvfb-run -a -s '-screen 0 1600x1200x24' godot --path . --script tests/maps_render.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-review
          path: build/map-review/*.png
          if-no-files-found: error
          retention-days: 14
