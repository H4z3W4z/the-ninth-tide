<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><g stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="1" width="798" height="998" rx="0" fill="#e4dbc2" stroke="#182f38" stroke-width="2"/><rect x="24" y="24" width="752" height="952" rx="0" fill="none" stroke="#182f38" stroke-width="1"/><text x="58" y="78" font-family="DejaVu Sans" font-size="23" fill="#567271" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="58" y="142" font-family="DejaVu Sans" font-size="33" fill="#182f38" text-anchor="start">THE EXTRA BOWL</text><text x="58" y="186" font-family="DejaVu Sans" font-size="22" fill="#567271" text-anchor="start">Folded inside the service drawer</text><path d="M58 213 L742 213" fill="none" stroke="#182f38" stroke-width="2"/><text x="58" y="266" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">The extra bowl was Venn’s.</text><text x="58" y="309" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">He ate with us.</text><text x="58" y="352" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start"></text><text x="58" y="395" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">His name is absent from the</text><text x="58" y="438" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">official attendance register.</text><text x="58" y="481" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start"></text><text x="58" y="524" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">I kept a place for him.</text><text x="58" y="567" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start"></text><text x="58" y="610" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">N. Bell</text></g></svg>
