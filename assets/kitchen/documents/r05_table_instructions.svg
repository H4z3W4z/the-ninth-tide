<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><g stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="1" width="798" height="998" rx="0" fill="#e4dbc2" stroke="#182f38" stroke-width="2"/><rect x="24" y="24" width="752" height="952" rx="0" fill="none" stroke="#182f38" stroke-width="1"/><text x="58" y="78" font-family="DejaVu Sans" font-size="23" fill="#567271" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="58" y="142" font-family="DejaVu Sans" font-size="33" fill="#182f38" text-anchor="start">SET THE PLACES</text><text x="58" y="186" font-family="DejaVu Sans" font-size="22" fill="#567271" text-anchor="start">Cloth pinned beneath the serving book</text><path d="M58 213 L742 213" fill="none" stroke="#182f38" stroke-width="2"/><text x="58" y="266" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">Match each initialed bowl to its place.</text><text x="58" y="309" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">The unsigned bowl has a square repair.</text><text x="58" y="352" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">Find the same square on the cloth.</text><text x="58" y="395" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start"></text><text x="58" y="438" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">Set the tally to the portions served.</text><text x="58" y="481" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">Compare it with the official count.</text><text x="58" y="524" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start"></text><text x="58" y="567" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">A place is not a signature.</text><text x="58" y="610" font-family="DejaVu Sans" font-size="25" fill="#182f38" text-anchor="start">Neither is a signature a meal.</text></g></svg>
