<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="1100" viewBox="0 0 900 1100"><rect x="1" y="1" width="898" height="1098" fill="#e4dbc2" stroke="#182f38" stroke-width="2"/><rect x="24" y="24" width="852" height="1052" fill="none" stroke="#567271" stroke-width="1"/><text x="56" y="72" font-family="DejaVu Sans" font-size="23" fill="#567271" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="56" y="135" font-family="DejaVu Sans" font-size="34" fill="#182f38" text-anchor="start">VENN / PERSONAL CARD</text><text x="56" y="182" font-family="DejaVu Sans" font-size="23" fill="#567271" text-anchor="start">Bunk locker / distinguishing habit</text><path d="M56 210 H844" stroke="#567271" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="267" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">Venn keeps pencils down to their stubs.</text><text x="56" y="312" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">His wooden holder has a pale crescent</text><text x="56" y="357" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">worn into its front by his thumb.</text><text x="56" y="402" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">He reaches for the same place each time.</text><svg x="170" y="560" width="560" height="400" viewBox="294 220 644 883" preserveAspectRatio="xMidYMid meet"><image x="0" y="0" width="1207" height="1303" xlink:href="../props/r06_pencil_holder.png"/><path d="M561 864 C479 898 479 978 561 1008" stroke="#d0ad73" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></svg>
