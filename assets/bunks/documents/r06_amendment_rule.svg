<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="1100" viewBox="0 0 900 1100"><rect x="1" y="1" width="898" height="1098" fill="#e4dbc2" stroke="#182f38" stroke-width="2"/><rect x="24" y="24" width="852" height="1052" fill="none" stroke="#567271" stroke-width="1"/><text x="56" y="72" font-family="DejaVu Sans" font-size="23" fill="#567271" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="56" y="135" font-family="DejaVu Sans" font-size="34" fill="#182f38" text-anchor="start">PERSONAL RECORD / ADDENDUM</text><text x="56" y="182" font-family="DejaVu Sans" font-size="23" fill="#567271" text-anchor="start">Correction procedure</text><path d="M56 210 H844" stroke="#567271" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="267" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">Keep the original Index entry legible.</text><text x="56" y="312" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">Compare the named record with the evidence.</text><text x="56" y="357" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">Append the identified effect and its owner.</text><text x="56" y="402" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start"></text><text x="56" y="447" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">Bell&#x27;s repaired cup remains on her shelf.</text><text x="56" y="492" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">Her provisioning page records both repairs.</text><text x="56" y="537" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start"></text><text x="56" y="582" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">A correction adds evidence.</text><text x="56" y="627" font-family="DejaVu Sans" font-size="26" fill="#182f38" text-anchor="start">It does not erase the first statement.</text></svg>
