ot seat.</text><text x="896" y="726" font-family="DejaVu Sans" font-size="22" fill="#172b36" text-anchor="start">Keep the original record.</text><text x="76" y="831" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">SPARE PARTS</text><rect x="76" y="855" width="590" height="148" rx="6" fill="#9a8060" stroke="#172b36" stroke-width="3"/><rect x="88" y="867" width="278" height="122" rx="0" fill="#d5c9a9" stroke="#172b36" stroke-width="2"/><rect x="376" y="867" width="278" height="122" rx="0" fill="#d5c9a9" stroke="#172b36" stroke-width="2"/><text x="711" y="890" font-family="DejaVu Sans" font-size="24" fill="#172b36" text-anchor="start">Select a part, then the socket.</text><text x="711" y="932" font-family="DejaVu Sans" font-size="22" fill="#51685f" text-anchor="start">Match the sketch before fitting.</text></g></svg>