<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="2" y="2" width="1196" height="896" rx="6" fill="#ded0ad" stroke="#243c46" stroke-width="4"/><rect x="24" y="24" width="1152" height="852" fill="none" stroke="#243c46"/><text x="80" y="110" font-family="DejaVu Sans" font-size="38" fill="#243c46">HOW TO READ A COMPOSITE</text><text x="80" y="180" font-family="DejaVu Sans" font-size="30" fill="#243c46">Match the cross, north arrow, and date.</text><text x="80" y="240" font-family="DejaVu Sans" font-size="30" fill="#243c46">The red trace crosses the marked transect.</text><text x="80" y="300" font-family="DejaVu Sans" font-size="30" fill="#243c46">Read the interval band at that crossing.</text><rect x="230" y="410" width="640" height="320" fill="none" stroke="#243c46" stroke-width="4"/><path d="M230 570H870M640 410V730" stroke="#243c46" stroke-width="3" stroke-dasharray="12 10"/><path d="M300 650C450 650 590 510 780 485" fill="none" stroke="#813f30" stroke-width="8"/><text x="905" y="510" font-family="DejaVu Sans" font-size="45" fill="#243c46">6</text><text x="905" y="680" font-family="DejaVu Sans" font-size="45" fill="#243c46">7</text><text x="80" y="825" font-family="DejaVu Sans" font-size="30" fill="#243c46">Example only: this crossing reads 6.</text></svg>