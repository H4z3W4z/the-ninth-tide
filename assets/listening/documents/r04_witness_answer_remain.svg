<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><g stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="1" width="798" height="998" rx="0" fill="#e6dcc4" stroke="#172b36" stroke-width="2"/><rect x="25" y="25" width="750" height="950" rx="0" fill="none" stroke="#172b36" stroke-width="1"/><text x="62" y="83" font-family="DejaVu Sans" font-size="23" fill="#536f70" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="62" y="146" font-family="DejaVu Sans" font-size="34" fill="#172b36" text-anchor="start">THE WITNESS ANSWERS</text><text x="62" y="190" font-family="DejaVu Sans" font-size="22" fill="#536f70" text-anchor="start">Listening Room / preserved exchange</text><path d="M62 220 L738 220" fill="none" stroke="#172b36" stroke-width="2"/><text x="62" y="275" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">ADA: What does taking your</text><text x="62" y="319" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">place mean?</text><text x="62" y="363" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="407" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">ELIAS VENN</text><text x="62" y="451" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">You keep the witness record open,</text><text x="62" y="495" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">and my duty ends. The traces remain</text><text x="62" y="539" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">accessible.</text><text x="62" y="583" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="627" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">[The indicator goes dark.</text><text x="62" y="671" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">Venn continues.]</text><text x="62" y="715" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="759" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">You must remain here, physically</text><text x="62" y="803" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">at the station.</text></g></svg>
