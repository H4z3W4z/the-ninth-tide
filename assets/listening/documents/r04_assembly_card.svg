<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><g stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="1" width="798" height="998" rx="0" fill="#e6dcc4" stroke="#172b36" stroke-width="2"/><rect x="25" y="25" width="750" height="950" rx="0" fill="none" stroke="#172b36" stroke-width="1"/><text x="62" y="83" font-family="DejaVu Sans" font-size="23" fill="#536f70" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="62" y="146" font-family="DejaVu Sans" font-size="34" fill="#172b36" text-anchor="start">REASSEMBLY</text><text x="62" y="190" font-family="DejaVu Sans" font-size="22" fill="#536f70" text-anchor="start">Wax recording bands</text><path d="M62 220 L738 220" fill="none" stroke="#172b36" stroke-width="2"/><text x="62" y="275" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">1. Find the band marked START.</text><text x="62" y="319" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">2. Fit the remaining bands toward END.</text><text x="62" y="363" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">3. Turn each band one notch at a time.</text><text x="62" y="407" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">4. Match the seam across both joins</text><text x="62" y="451" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">    and the two fixed end guides.</text><text x="62" y="495" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">5. Lower the needle and PLAY.</text><text x="62" y="539" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="583" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">A broken seam can always be adjusted.</text><text x="62" y="650" font-family="DejaVu Sans" font-size="22" fill="#536f70" text-anchor="start">SEAM EXAMPLE / unrelated practice pieces</text><rect x="100" y="690" width="300" height="165" rx="0" fill="#815f49" stroke="#172b36" stroke-width="3"/><text x="250" y="902" font-family="DejaVu Sans" font-size="28" fill="#172b36" text-anchor="middle">X</text><rect x="400" y="690" width="300" height="165" rx="0" fill="#815f49" stroke="#172b36" stroke-width="3"/><text x="550" y="902" font-family="DejaVu Sans" font-size="28" fill="#172b36" text-anchor="middle">Y</text><path d="M100 745 L400 782" fill="none" stroke="#e6dcc4" stroke-width="6"/><path d="M400 782 L700 819" fill="none" stroke="#e6dcc4" stroke-width="6"/><circle cx="400" cy="782" r="11" fill="#be9657" stroke="#172b36" stroke-width="2"/></g></svg>
