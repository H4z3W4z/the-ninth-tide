<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><g stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="1" width="798" height="998" rx="0" fill="#e6dcc4" stroke="#172b36" stroke-width="2"/><rect x="25" y="25" width="750" height="950" rx="0" fill="none" stroke="#172b36" stroke-width="1"/><text x="62" y="83" font-family="DejaVu Sans" font-size="23" fill="#536f70" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="62" y="146" font-family="DejaVu Sans" font-size="34" fill="#172b36" text-anchor="start">THE WITNESS ANSWERS</text><text x="62" y="190" font-family="DejaVu Sans" font-size="22" fill="#536f70" text-anchor="start">Listening Room / preserved exchange</text><path d="M62 220 L738 220" fill="none" stroke="#172b36" stroke-width="2"/><text x="62" y="275" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">ADA: Did you save them?</text><text x="62" y="319" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="363" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">ELIAS VENN</text><text x="62" y="407" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">I kept them within reach. I could</text><text x="62" y="451" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">not bring them out. I cannot promise</text><text x="62" y="495" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">that what remains is whole.</text></g></svg>
