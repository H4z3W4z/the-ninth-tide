<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><g stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="1" width="798" height="998" rx="0" fill="#e6dcc4" stroke="#172b36" stroke-width="2"/><rect x="25" y="25" width="750" height="950" rx="0" fill="none" stroke="#172b36" stroke-width="1"/><text x="62" y="83" font-family="DejaVu Sans" font-size="23" fill="#536f70" text-anchor="start">GREYWAKE SURVEY STATION</text><text x="62" y="146" font-family="DejaVu Sans" font-size="34" fill="#172b36" text-anchor="start">A SMALL REQUEST</text><text x="62" y="190" font-family="DejaVu Sans" font-size="22" fill="#536f70" text-anchor="start">Pinned beside the recording log</text><path d="M62 220 L738 220" fill="none" stroke="#172b36" stroke-width="2"/><text x="62" y="275" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">After playback, return both earpieces</text><text x="62" y="319" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">to the hook.</text><text x="62" y="363" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="407" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">I have twice found one warm after</text><text x="62" y="451" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">the mechanism had been stopped</text><text x="62" y="495" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">for the night.</text><text x="62" y="539" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="583" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">The lamp does not reach that wall.</text><text x="62" y="627" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start"></text><text x="62" y="671" font-family="DejaVu Sans" font-size="25" fill="#172b36" text-anchor="start">E. V.</text></g></svg>
