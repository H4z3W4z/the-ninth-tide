<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086"><g stroke-linejoin="round" stroke-linecap="round"><text x="110" y="142" font-family="DejaVu Sans" font-size="38" fill="#e6dcc4" text-anchor="start">SESSION SEPARATION</text><text x="110" y="196" font-family="DejaVu Sans" font-size="28" fill="#e6dcc4" text-anchor="start">Align the two bell peaks with the same guide.</text><text x="144" y="280" font-family="DejaVu Sans" font-size="27" fill="#e6dcc4" text-anchor="start">VENN</text><rect x="144" y="312" width="1160" height="144" rx="0" fill="#dfd7c2" stroke="#172b36" stroke-width="3"/><path d="M724 312 L724 456" fill="none" stroke="#8a6032" stroke-width="4"/><text x="144" y="565" font-family="DejaVu Sans" font-size="27" fill="#e6dcc4" text-anchor="start">NORA</text><rect x="144" y="582" width="1160" height="144" rx="0" fill="#dfd7c2" stroke="#172b36" stroke-width="3"/><path d="M724 582 L724 726" fill="none" stroke="#8a6032" stroke-width="4"/><text x="724" y="852" font-family="DejaVu Sans" font-size="24" fill="#e6dcc4" text-anchor="middle">BELL GUIDE</text><text x="110" y="925" font-family="DejaVu Sans" font-size="28" fill="#e6dcc4" text-anchor="start">Listen to each voice separately.</text><text x="110" y="972" font-family="DejaVu Sans" font-size="27" fill="#e6dcc4" text-anchor="start">Both statements remain in the notebook.</text></g></svg>
