<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086"><g stroke-linejoin="round" stroke-linecap="round"><text x="110" y="142" font-family="DejaVu Sans" font-size="38" fill="#e6dcc4" text-anchor="start">TOMORROW&#x27;S RECORDING</text><text x="110" y="196" font-family="DejaVu Sans" font-size="27" fill="#e6dcc4" text-anchor="start">Fit START to END. Match the seam at both joins and guides.</text><text x="110" y="242" font-family="DejaVu Sans" font-size="25" fill="#e6dcc4" text-anchor="start">Select a band, then a slot. Turn the fitted band one notch at a time.</text><text x="88" y="322" font-family="DejaVu Sans" font-size="22" fill="#e6dcc4" text-anchor="start">BANDS</text><rect x="292" y="290" width="288" height="320" rx="0" fill="#3a3630" stroke="#e6dcc4" stroke-width="2"/><rect x="580" y="290" width="288" height="320" rx="0" fill="#3a3630" stroke="#e6dcc4" stroke-width="2"/><rect x="868" y="290" width="288" height="320" rx="0" fill="#3a3630" stroke="#e6dcc4" stroke-width="2"/><text x="724" y="266" font-family="DejaVu Sans" font-size="23" fill="#e6dcc4" text-anchor="middle">CYLINDER SPINDLE</text></g></svg>
